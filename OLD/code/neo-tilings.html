<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Складка над зоногоном</title>
<style>
  :root{
    --paper:#f4f2ec; --panel:#fbfaf6; --ink:#1c1f1b; --muted:#6d7268; --line:#dbd8ce;
    --leaf:#3f8f74; --fold:#cf6a34; --riser:#6b7f96; --accent:#3f8f74;
    --sblue:#1668e3; --sorng:#ff7a18;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#15181a; --panel:#1b1f21; --ink:#e9e7df; --muted:#98a096; --line:#333a3c;
      --leaf:#4fae8e; --fold:#e4834b; --riser:#8fa5bd; --accent:#4fae8e;
      --sblue:#5aa7ff; --sorng:#ff9a4d;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);line-height:1.45;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:18px 16px 22px;}
  .wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:7px}
  input[type=number]{width:64px}
  input[type=number],input[type=text]{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9rem;
    padding:6px 8px;border-radius:5px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);}
  input[type=text]{flex:1;min-width:220px}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
  .msg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;color:var(--muted)}
  .box{position:relative;border:1px solid var(--line);border-radius:6px;
       background:var(--panel);overflow:hidden}
  canvas{display:block;width:100%;height:min(74vh,620px);min-height:340px;
         touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <label>T <input id="tval" type="number" min="2" max="8" step="1" value="4"></label>
    <label style="flex:1">слово <input id="wordin" type="text" spellcheck="false"
      value="2 3 2 3 1 2 1 3 2 1 2 1"></label>
    <label><input id="flat" type="checkbox">развёртка</label>
  </div>
  <div class="msg" id="msg"></div>
  <div class="box"><canvas id="cv"></canvas></div>
</div>

<script>
(function(){
"use strict";

/* ---------- слово -> геометрия ---------- */

function wordSteps(T,letters){
  var o=[],i,k;
  for(i=1;i<=T;i++) o.push(i);
  for(k=0;k<letters.length;k++){ var p=letters[k], t=o[p-1]; o[p-1]=o[p]; o[p]=t; }
  return {T:T,start:o,positions:letters.slice().reverse()};
}

function geom(sp){
  var T=sp.T, positions=sp.positions, i,t;
  var orders=[sp.start.slice()], cur=sp.start.slice();
  for(i=0;i<positions.length;i++){
    var p=positions[i], tmp=cur[p-1]; cur=cur.slice(); cur[p-1]=cur[p]; cur[p]=tmp;
    orders.push(cur.slice());
  }
  var V=[null], A0=62*Math.PI/180;
  for(t=1;t<=T;t++){
    var th=(T===1)?0:A0*(2*(t-1)/(T-1)-1);
    V.push([Math.cos(th)/Math.cos(A0/2), Math.sin(th)/Math.cos(A0/2)]);
  }
  function pathOf(o){ var P=[[0,0]],k;
    for(k=0;k<o.length;k++) P.push([P[k][0]+V[o[k]][0],P[k][1]+V[o[k]][1]]); return P; }

  var o=orders[0].slice(), Pp=pathOf(o), rh=[], adj=[], owner=[], pre=[];
  for(i=0;i<T;i++) owner.push(-1);
  for(i=0;i<positions.length;i++){
    pre.push(Pp.map(function(q){return q.slice();}));
    var pos=positions[i], A=Pp[pos-1].slice(), a=o[pos-1], b=o[pos];
    var p1=[A[0]+V[a][0],A[1]+V[a][1]];
    var p2=[p1[0]+V[b][0],p1[1]+V[b][1]];
    var p3=[A[0]+V[b][0],A[1]+V[b][1]];
    rh.push({q:[A,p1,p2,p3], gen:pos, fwd:(o[pos-1]>o[pos])});
    if(owner[pos-1]>=0) adj.push({i:i,j:owner[pos-1]});
    if(owner[pos]>=0)   adj.push({i:i,j:owner[pos]});
    owner[pos-1]=i; owner[pos]=i;
    Pp[pos]=p3; o[pos-1]=b; o[pos]=a;
  }
  var snake0=Pp.map(function(q){return q.slice();});

  var lev=0, prevF=null;
  for(i=rh.length-1;i>=0;i--){
    if(prevF!==null && rh[i].fwd!==prevF) lev++;
    rh[i].lev=lev; prevF=rh[i].fwd;
  }
  var nlev=lev+1, levFwd=[];
  for(i=0;i<rh.length;i++) levFwd[rh[i].lev]=rh[i].fwd;

  var snakes=[];
  for(var L=0;L<nlev;L++){
    var i0=-1;
    for(i=0;i<rh.length;i++) if(rh[i].lev<=L){ i0=i; break; }
    snakes.push(i0<0?null:pre[i0]);
  }
  var asc=[],desc=[];
  for(t=1;t<=T;t++){ asc.push(t); desc.push(T+1-t); }
  var hex=pathOf(asc).concat(pathOf(desc).slice(1,T).reverse());
  var w0=true;
  for(i=0;i<T;i++) if(sp.start[i]!==T-i) w0=false;
  return {T:T,rh:rh,snakes:snakes,snake0:snake0,levFwd:levFwd,hex:hex,nlev:nlev,
          C:positions.length,isW0:w0};
}

/* ---------- рендер ---------- */

var M=null, FLAT=false;
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var yaw=-0.44, pitch=0.36, zoom=1, DEF={yaw:-0.44,pitch:0.36};
var CX=0,CY=0,CZC=0,DIST=8,SC=1.12, W=0,H=0,DPR=1;
var DZ=0.3, HY=1, WX=1, GAP=0.5;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  var r=cv.getBoundingClientRect();
  W=Math.max(200,Math.round(r.width)); H=Math.max(200,Math.round(r.height));
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function place(p,lev){
  if(FLAT){
    var X=-p[1], Y=p[0];
    if(lev%2) X=-X;
    return [X-lev*(2*HY+GAP), Y, 0];
  }
  return [p[0], p[1], DZ*(lev+1)];
}
function proj(p){
  var x=p[0]-CX,y=p[1]-CY,z=p[2]-CZC;
  var ca=Math.cos(yaw),sa=Math.sin(yaw);
  var X=x*ca-y*sa, Y=x*sa+y*ca;
  var cb=Math.cos(pitch),sb=Math.sin(pitch);
  var Y2=Y*cb-z*sb, Z2=Y*sb+z*cb;
  var d=DIST+Y2; if(d<0.4) d=0.4;
  var f=Math.min(W,H*1.5)*SC*zoom/d;
  return [W/2+f*X, H/2-f*Z2, Y2];
}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hex2rgb(h){h=h.replace("#","");
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(c,t){var f=function(v){return t>=0?v+(255-v)*t:v*(1+t);};return [f(c[0]),f(c[1]),f(c[2])];}
function rgba(c,a){return "rgba("+Math.round(c[0])+","+Math.round(c[1])+","+Math.round(c[2])+","+a+")";}
function insetQ(q,e){
  var cx=(q[0][0]+q[1][0]+q[2][0]+q[3][0])/4, cy=(q[0][1]+q[1][1]+q[2][1]+q[3][1])/4;
  return q.map(function(p){return [cx+(p[0]-cx)*(1-e), cy+(p[1]-cy)*(1-e)];});
}
function bil(q,s,t){
  var a=q[0],b=q[1],c=q[2],d=q[3];
  return [a[0]+(b[0]-a[0])*s+(d[0]-a[0])*t+(a[0]-b[0]+c[0]-d[0])*s*t,
          a[1]+(b[1]-a[1])*s+(d[1]-a[1])*t+(a[1]-b[1]+c[1]-d[1])*s*t];
}
function fit(){
  var pts=[],i,Lv;
  if(FLAT){
    var top=Math.min(1,M.nlev-1);
    for(Lv=0;Lv<=top;Lv++) for(i=0;i<M.hex.length;i++) pts.push(place(M.hex[i],Lv));
  } else {
    for(Lv=0;Lv<M.nlev;Lv++) for(i=0;i<M.hex.length;i++) pts.push(place(M.hex[i],Lv));
  }
  var mn=[1e9,1e9,1e9],MX=[-1e9,-1e9,-1e9];
  for(i=0;i<pts.length;i++) for(var k=0;k<3;k++){
    if(pts[i][k]<mn[k])mn[k]=pts[i][k]; if(pts[i][k]>MX[k])MX[k]=pts[i][k];
  }
  CX=(mn[0]+MX[0])/2; CY=(mn[1]+MX[1])/2; CZC=(mn[2]+MX[2])/2;
  var R=0;
  for(i=0;i<pts.length;i++){
    var d=Math.hypot(pts[i][0]-CX,pts[i][1]-CY,pts[i][2]-CZC); if(d>R)R=d;
  }
  DIST=3.3*R; SC=1.12;
}

var NS=3;
function build(C){
  var items=[],i,r,c,Lv,L;

  if(FLAT){
    for(Lv=0;Lv<M.nlev;Lv++){
      items.push({t:"line",col:rgba(C.lineRGB,1),lw:1.2,
        pts:M.hex.concat([M.hex[0]]).map(function(p){return place(p,Lv);})});
      if(Lv+1<M.nlev){
        var xc=-Lv*(2*HY+GAP)-HY-GAP/2;
        items.push({t:"line",pts:[[xc,-0.35,0],[xc,WX+0.35,0]],
                    col:rgba(C.riserRGB,0.9),lw:1.6,dash:[7,6]});
      }
    }
  }

  for(i=0;i<M.rh.length;i++){
    var rh=M.rh[i];
    var fam=rh.fwd?C.leafRGB:C.foldRGB;
    var col=mix(fam,[0,0.15,-0.14][rh.gen%3]);
    var qq=insetQ(rh.q,0.075), lv=rh.lev;
    for(r=0;r<NS;r++) for(c=0;c<NS;c++){
      items.push({t:"quad",hair:true,fill:rgba(col,1),
        pts:[place(bil(qq,r/NS,c/NS),lv),place(bil(qq,(r+1)/NS,c/NS),lv),
             place(bil(qq,(r+1)/NS,(c+1)/NS),lv),place(bil(qq,r/NS,(c+1)/NS),lv)]});
    }
    items.push({t:"line",col:rgba(mix(fam,-0.6),1),lw:1.8,
      pts:qq.concat([qq[0]]).map(function(p){return place(p,lv);})});
    var ctr=[(rh.q[0][0]+rh.q[2][0])/2,(rh.q[0][1]+rh.q[2][1])/2];
    items.push({t:"text",pts:[place(ctr,lv)],txt:"s"+rh.gen,
                col:rgba(mix(fam,-0.7),1),halo:rgba(mix(fam,0.6),1)});
  }

  var dx=0;
  if(FLAT){ var ff=Math.min(W,H*1.5)*SC*zoom/DIST; dx=3.0/ff; }
  for(L=0;L<M.nlev;L++){
    var right=(L===0)?M.snake0:M.snakes[L-1], left=M.snakes[L];
    if(!right||!left) continue;
    var fw=M.levFwd[L], lv2=L;
    var cR=fw?C.blue:C.orng, cL=fw?C.orng:C.blue;
    items.push({t:"line",col:rgba(cR,1),lw:3.0,
      pts:right.map(function(p){var q=place(p,lv2);return [q[0]+dx,q[1],q[2]];})});
    items.push({t:"line",col:rgba(cL,1),lw:3.0,
      pts:left.map(function(p){var q=place(p,lv2);return [q[0]-dx,q[1],q[2]];})});
  }

  if(!FLAT){
    for(L=0;L+1<M.nlev;L++){
      var sp=M.snakes[L]; if(!sp) continue;
      for(var z=0;z+1<sp.length;z++){
        items.push({t:"quad",fill:rgba(C.riserRGB,0.18),
          pts:[place(sp[z],L),place(sp[z+1],L),place(sp[z+1],L+1),place(sp[z],L+1)]});
      }
      for(z=0;z<sp.length;z++)
        items.push({t:"line",pts:[place(sp[z],L),place(sp[z],L+1)],
                    col:rgba(C.riserRGB,0.45),lw:1.1});
    }
  }
  return items;
}
function depth(it){var s=0,i;for(i=0;i<it.pts.length;i++)s+=proj(it.pts[i])[2];return s/it.pts.length;}

function draw(){
  if(!M) return;
  var C={leafRGB:hex2rgb(css("--leaf")),foldRGB:hex2rgb(css("--fold")),
         riserRGB:hex2rgb(css("--riser")),lineRGB:hex2rgb(css("--line")),
         blue:hex2rgb(css("--sblue")),orng:hex2rgb(css("--sorng")),panel:css("--panel")};
  ctx.clearRect(0,0,W,H); ctx.fillStyle=C.panel; ctx.fillRect(0,0,W,H);
  var items=build(C),i,j,p;
  for(i=0;i<items.length;i++) items[i]._d=depth(items[i]);
  items.sort(function(a,b){return b._d-a._d;});
  ctx.lineJoin="round"; ctx.lineCap="round";
  for(i=0;i<items.length;i++){
    var it=items[i];
    if(it.t==="text") continue;
    ctx.beginPath();
    for(j=0;j<it.pts.length;j++){p=proj(it.pts[j]); if(j===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);}
    if(it.t==="quad"){
      ctx.closePath(); ctx.fillStyle=it.fill; ctx.fill(); ctx.setLineDash([]);
      if(it.hair){ctx.strokeStyle=it.fill;ctx.lineWidth=1;ctx.stroke();}
    } else {
      ctx.setLineDash(it.dash||[]); ctx.strokeStyle=it.col; ctx.lineWidth=it.lw||1; ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font='500 11px ui-monospace, Menlo, Consolas, monospace';
  for(i=0;i<items.length;i++){
    var t=items[i]; if(t.t!=="text") continue;
    p=proj(t.pts[0]);
    ctx.lineWidth=3.2; ctx.strokeStyle=t.halo; ctx.strokeText(t.txt,p[0],p[1]);
    ctx.fillStyle=t.col; ctx.fillText(t.txt,p[0],p[1]);
  }
}
var raf=null;
function schedule(){ if(raf) return; raf=requestAnimationFrame(function(){raf=null;draw();}); }

/* ---------- ввод ---------- */

function load(){
  var T=Math.max(2,Math.min(8,parseInt(document.getElementById("tval").value,10)||4));
  var raw=document.getElementById("wordin").value.match(/\d+/g)||[];
  var letters=[],bad=0,q;
  for(q=raw.length-1;q>=0;q--){
    var v=parseInt(raw[q],10);
    if(v>=1 && v<=T-1) letters.push(v); else bad++;
  }
  var msg="";
  if(!letters.length){ letters=[1]; msg="нужны буквы от 1 до "+(T-1); }
  M=geom(wordSteps(T,letters));
  HY=0; WX=0;
  for(q=0;q<M.hex.length;q++){ HY=Math.max(HY,Math.abs(M.hex[q][1])); WX=Math.max(WX,M.hex[q][0]); }
  DZ=0.95*M.T/Math.max(1,M.nlev);
  if(!msg){
    msg=(M.isW0?"слово переводит e в w₀":"слово не переводит e в w₀")
      +" · букв "+M.C+" · слоёв "+M.nlev+" · камер "+(1+M.T+M.C);
    if(bad) msg+=" · отброшено букв: "+bad;
  }
  document.getElementById("msg").textContent=msg;
  fit(); schedule();
}

var drag=null;
cv.addEventListener("pointerdown",function(e){drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",function(e){
  if(!drag) return;
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(FLAT){
    var f=Math.min(W,H*1.5)*SC*zoom/DIST;
    CX-=dx/f; CY+=dy/f;
  } else {
    yaw+=dx*0.008;
    pitch=Math.max(-1.35,Math.min(1.35,pitch+dy*0.006));
  }
  drag={x:e.clientX,y:e.clientY}; schedule();
});
cv.addEventListener("pointerup",function(){drag=null;});
cv.addEventListener("pointercancel",function(){drag=null;});
cv.addEventListener("wheel",function(e){e.preventDefault();
  zoom=Math.max(0.4,Math.min(4,zoom*(e.deltaY>0?0.92:1.087))); schedule();},{passive:false});
cv.addEventListener("dblclick",function(){
  if(FLAT){yaw=0;pitch=Math.PI/2;} else {yaw=DEF.yaw;pitch=DEF.pitch;}
  zoom=1; fit(); schedule();
});

document.getElementById("tval").addEventListener("input",load);
document.getElementById("wordin").addEventListener("input",load);
document.getElementById("flat").addEventListener("input",function(){
  FLAT=this.checked;
  if(FLAT){ yaw=0; pitch=Math.PI/2; } else { yaw=DEF.yaw; pitch=DEF.pitch; }
  zoom=1; fit(); schedule();
});
window.addEventListener("resize",function(){resize();schedule();});
if(window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",schedule);

resize(); load();
})();
</script>
</body>
</html>
